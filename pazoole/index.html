<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PAZOOLEは、動物を選んでマスを塗り、同じ広さの縄張りをつくるiPhone向けロジックパズルです。">
  <title>PAZOOLE</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9eddc; color: #234335; font-family: system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; width: min(100%, 66rem); min-height: 100svh; margin: auto; }
    img { width: 100%; height: 100%; max-height: 100svh; object-fit: cover; }
    section { align-content: center; padding: clamp(1.5rem, 6vw, 4rem); }
    h1 { margin: 0; font-size: clamp(2.45rem, 7vw, 4.5rem); letter-spacing: .038em; }
    p { line-height: 1.8; }
    nav { display: flex; align-items: flex-start; flex-wrap: wrap; margin-top: 1.5rem; gap: .8rem 1rem; }
    a { color: inherit; }
    a.store { display: inline-block; padding: .75rem 1.1rem; border-radius: .65rem; background: #315945; color: #fff; font-weight: 650; text-decoration: none; }
    @media (max-width: 40rem) {
      main { grid-template-columns: 1fr; grid-template-rows: min(52svh, 27rem) 1fr; }
      img { object-position: center 46%; }
    }
  </style>
</head>
<body>
  <main>
    <img src="forest.jpg" alt="" width="1024" height="1536">
    <section>
      <h1>PAZOOLE</h1>
      <p>動物を選んでマスを塗り、同じ広さの縄張りをつくろう。4×4から12×12まで、全500ステージのロジックパズルです。</p>
      <a class="store" href="https://apps.apple.com/jp/app/pazoole/id6838342734">App Storeで見る</a>
      <nav aria-label="サポート情報">
        <a href="https://animal-territory-mori-1123.xdiary.chatgpt.site/support.html">サポート</a>
        <a href="https://animal-territory-mori-1123.xdiary.chatgpt.site/privacy.html">プライバシーポリシー</a>
      </nav>
    </section>
  </main>
</body>
</html>
